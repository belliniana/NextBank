<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextBank | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="row min-vh-100 align-items-center justify-content-center">

            <div class="col-lg-10">

                <div class="card border-0 shadow-lg overflow-hidden">

                    <div class="row g-0">

                        <div class="col-md-6 banner">

                            <div class="banner-content">

                                <h1>NextBank</h1>

                                <p>
                                    Seu banco digital moderno, rápido e seguro.
                                </p>

                                <i class="bi bi-bank display-1"></i>

                            </div>

                        </div>

                        <div class="col-md-6">

                            <div class="p-5">

                                <ul class="nav nav-pills mb-4 justify-content-center">

                                    <li class="nav-item">

                                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">

                                            Login

                                        </button>

                                    </li>

                                    <li class="nav-item">

                                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#cadastro">

                                            Cadastro

                                        </button>

                                    </li>

                                </ul>

                                <div class="tab-content">


                                    <div class="tab-pane fade show active" id="login">

                                        <form id="loginForm">

                                            <div class="form-floating mb-3">

                                                <input type="email" class="form-control" id="loginEmail"
                                                    placeholder="Email">

                                                <label>Email</label>

                                            </div>

                                            <div class="form-floating mb-3">

                                                <input type="password" class="form-control" id="loginSenha"
                                                    placeholder="Senha">

                                                <label>Senha</label>

                                            </div>

                                            <button class="btn btn-info text-white w-100">

                                                Entrar

                                            </button>

                                        </form>

                                    </div>

                                    <div class="tab-pane fade" id="cadastro">

                                        <form id="registerForm">

                                            <div class="form-floating mb-3">

                                                <input type="text" class="form-control" placeholder="Nome">

                                                <label>Nome Completo</label>

                                            </div>

                                            <div class="form-floating mb-3">

                                                <input type="email" class="form-control" placeholder="Email">

                                                <label>Email</label>

                                            </div>

                                            <div class="form-floating mb-3">

                                                <input type="password" class="form-control" placeholder="Senha">

                                                <label>Senha</label>

                                            </div>

                                            <button class="btn btn-success w-100">

                                                Criar Conta

                                            </button>

                                        </form>

                                    </div>

                                </div>

                                <div id="message" class="mt-3"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    </div>

    <script src="js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
